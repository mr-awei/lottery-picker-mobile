<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https: ws: http://localhost:5173 data: blob:; worker-src 'self' blob: data:; font-src 'self' data:">
  <title>彩票选号器</title>
  <script src="./boot-error.js"></script>
  <style>
    #lp-boot {
      /* 兼容 WebView 83（Android 11 自带）：inset 简写需 Chrome 87+，
         否则 position:fixed 拿不到定位值会收缩成内容大小（表现为左上角一小块） */
      position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #ffffff; transition: opacity .3s ease;
    }
    #lp-boot.hide { opacity: 0; pointer-events: none; }
    /* 兼容 WebView 83：flex gap 需 Chrome 84+，改用 margin 实现球间距 */
    .lp-boot-balls { display: flex; margin-bottom: 20px; }
    .lp-boot-balls span + span { margin-left: 8px; }
    .lp-boot-balls span {
      width: 28px; height: 28px; border-radius: 50%;
      animation: lp-bounce 1.2s ease-in-out infinite;
    }
    .lp-boot-balls span:nth-child(1) { background: #409eff; animation-delay: 0s; }
    .lp-boot-balls span:nth-child(2) { background: #67c23a; animation-delay: .15s; }
    .lp-boot-balls span:nth-child(3) { background: #e6a23c; animation-delay: .3s; }
    @keyframes lp-bounce {
      0%, 80%, 100% { transform: scale(.6); opacity: .5; }
      40% { transform: scale(1); opacity: 1; }
    }
    .lp-boot-title { font-size: 20px; font-weight: 600; color: #2a3350; margin-bottom: 8px; }
    .lp-boot-sub { font-size: 13px; color: #909399; letter-spacing: 2px; }
  </style>
</head>
<body>
  <div id="lp-boot">
    <div class="lp-boot-balls"><span></span><span></span><span></span></div>
    <div class="lp-boot-title">彩票选号器</div>
    <div class="lp-boot-sub">DAILY LOTTERY PICKER</div>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
